<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="900" fill="#1F2A3C"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><text x="60" y="78" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="17" font-weight="500" fill="#60A5FA" text-anchor="start" letter-spacing="2">BEFORE / AFTER</text><text x="60" y="128" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#F8FAFC" text-anchor="start" letter-spacing="0">One reporting cycle</text><rect x="60" y="190" width="525" height="640" rx="14" fill="#2A374C" stroke="#3E4D66" stroke-width="2"/><text x="90" y="240" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="16" font-weight="500" fill="#FCA5A5" text-anchor="start" letter-spacing="1.5">BEFORE · MANUAL</text><rect x="90" y="290" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="118" y="341" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#FCA5A5" text-anchor="start" letter-spacing="0">1</text><text x="160" y="340" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Chase updates by email</text><rect x="90" y="395" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="118" y="446" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#FCA5A5" text-anchor="start" letter-spacing="0">2</text><text x="160" y="445" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Copy them into the template</text><rect x="90" y="500" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="118" y="551" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#FCA5A5" text-anchor="start" letter-spacing="0">3</text><text x="160" y="550" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Format and fix inconsistencies</text><rect x="90" y="605" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="118" y="656" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#FCA5A5" text-anchor="start" letter-spacing="0">4</text><text x="160" y="655" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Send for review, then revise</text><rect x="90" y="725" width="465" height="80" rx="10" fill="#4A2230" stroke="#FCA5A5" stroke-width="2"/><text x="118" y="776" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#FCA5A5" text-anchor="start" letter-spacing="0">6–8 hours</text><text x="530" y="774" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="15" font-weight="500" fill="#CBD5E1" text-anchor="end" letter-spacing="1.2">PER CYCLE</text><rect x="615" y="190" width="525" height="640" rx="14" fill="#2A374C" stroke="#3E4D66" stroke-width="2"/><text x="645" y="240" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="16" font-weight="500" fill="#6EE7B7" text-anchor="start" letter-spacing="1.5">AFTER · AGENT + REVIEW</text><rect x="645" y="290" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="673" y="341" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="0">1</text><text x="715" y="340" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Inputs collected automatically</text><rect x="645" y="395" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="673" y="446" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="0">2</text><text x="715" y="445" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Agent drafts to the standard</text><rect x="645" y="500" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="673" y="551" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="0">3</text><text x="715" y="550" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">BA reviews and edits</text><rect x="645" y="605" width="465" height="82" rx="10" fill="#1F2A3C" stroke="#3E4D66" stroke-width="2"/><text x="673" y="656" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="0">4</text><text x="715" y="655" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#F8FAFC" text-anchor="start" letter-spacing="0">Publish and notify</text><rect x="645" y="725" width="465" height="80" rx="10" fill="#11423A" stroke="#6EE7B7" stroke-width="2"/><text x="673" y="776" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="0">~2 hours</text><text x="1085" y="774" font-family="'IBM Plex Mono',Consolas,Menlo,monospace" font-size="15" font-weight="500" fill="#CBD5E1" text-anchor="end" letter-spacing="1.2">PER CYCLE</text></svg>